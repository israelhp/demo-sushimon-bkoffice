<body>
  <div id="__bundler_placeholder">Loading Backoffice Sushi Mon...</div>
  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

hist.max}}\" sc-camel-on-change=\"{{hist.onMax}}\"><\u002Fspan><\u002Fdiv>\n   <\u002Fdiv>\n   <div class=\"field\"><span class=\"flabel\">Ordenar por<\u002Fspan><div class=\"seg\"><sc-for list=\"{{hist.sortSeg}}\" as=\"m\" hint-placeholder-count=\"4\"><button class=\"{{m.cls}}\" aria-pressed=\"{{m.active}}\" sc-camel-on-click=\"{{m.pick}}\">{{m.label}}<\u002Fbutton><\u002Fsc-for><\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n <\u002Fsection>\n\n <div class=\"kpis\">\n  <sc-for list=\"{{hist.kpis}}\" as=\"k\" hint-placeholder-count=\"5\">\n   <div class=\"kpi\"><div class=\"kpi-top\"><span class=\"kpi-label\">{{k.label}}<\u002Fspan><span class=\"kdot {{k.cls}}\"><\u002Fspan><\u002Fdiv><div class=\"kpi-val\" style=\"font-size: 28px\">{{k.value}}<\u002Fdiv><div class=\"kpi-foot\">{{k.foot}}<\u002Fdiv><\u002Fdiv>\n  <\u002Fsc-for>\n <\u002Fdiv>\n\n <section class=\"card\">\n  <div class=\"card-h\">\n   <div class=\"grow\"><h2>Pedidos del periodo<\u002Fh2><div class=\"muted sm\" style=\"font-weight: 600\">Mostrando {{hist.shown}} de {{hist.total}} · toca un pedido para ver su detalle<\u002Fdiv><\u002Fdiv>\n   <button class=\"btn sm\" sc-camel-on-click=\"{{hist.exportCsv}}\"><svg class=\"ic sm\" sc-camel-view-box=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3\"><\u002Fpath><\u002Fsvg>Exportar CSV<\u002Fbutton>\n  <\u002Fdiv>\n  <div class=\"tscroll\">\n   <div class=\"min-hist\">\n    <div class=\"thead cols-hist\"><span>Pedido<\u002Fspan><span>Hora<\u002Fspan><span>Cliente<\u002Fspan><span>Sucursal<\u002Fspan><span>Tipo<\u002Fspan><span>Productos<\u002Fspan><span>Total<\u002Fspan><span>Estado<\u002Fspan><span><\u002Fspan><\u002Fdiv>\n    <sc-for list=\"{{hist.groups}}\" as=\"g\" hint-placeholder-count=\"2\">\n     <div class=\"day-h\"><span class=\"strong\">{{g.label}}<\u002Fspan><span class=\"sm\" style=\"font-weight: 700\">{{g.sub}}<\u002Fspan><span class=\"spacer\"><\u002Fspan><sc-if value=\"{{g.canFocus}}\"><button class=\"link-btn\" sc-camel-on-click=\"{{g.focus}}\">Ver solo este día<\u002Fbutton><\u002Fsc-if><\u002Fdiv>\n     <sc-for list=\"{{g.rows}}\" as=\"o\" hint-placeholder-count=\"5\">\n      <div class=\"trow cols-hist\">\n       <button class=\"tid\" sc-camel-on-click=\"{{o.open}}\">{{o.code}}<\u002Fbutton>\n       <div class=\"num sm\" style=\"font-weight: 700\">{{o.time}}<\u002Fdiv>\n       <div><div class=\"cell-main trunc\">{{o.client}}<\u002Fdiv><div class=\"cell-sub num\">{{o.phone}}<\u002Fdiv><\u002Fdiv>\n       <div class=\"hide-sm\"><span class=\"btag\">{{o.branchShort}}<\u002Fspan><\u002Fdiv>\n       <div class=\"hide-sm\"><span class=\"zone-tag\">{{o.typeShort}}<\u002Fspan><\u002Fdiv>\n       <div class=\"sm hide-sm trunc\" title=\"{{o.prodText}}\" style=\"font-weight: 600\">{{o.prodText}}<\u002Fdiv>\n       <div class=\"num strong\">{{o.totalF}}<\u002Fdiv>\n       <div><span class=\"pill {{o.stCls}}\">{{o.stLabel}}<\u002Fspan><div class=\"cell-sub trunc\">{{o.reasonText}}<\u002Fdiv><\u002Fdiv>\n       <div class=\"row-actions\"><button class=\"icon-btn\" aria-label=\"Ver detalle de {{o.code}}\" sc-camel-on-click=\"{{o.open}}\"><svg class=\"ic sm\" sc-camel-view-box=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z\"><\u002Fpath><circle cx=\"12\" cy=\"12\" r=\"3\"><\u002Fcircle><\u002Fsvg><\u002Fbutton><\u002Fdiv>\n      <\u002Fdiv>\n     <\u002Fsc-for>\n    <\u002Fsc-for>\n    <sc-if value=\"{{hist.empty}}\"><div class=\"empty\"><div class=\"empty-t\">Sin pedidos<\u002Fdiv><div class=\"sm\">Ningún pedido coincide con el periodo y los filtros elegidos.<\u002Fdiv><\u002Fdiv><\u002Fsc-if>\n   <\u002Fdiv>\n  <\u002Fdiv>\n  <sc-if value=\"{{hist.hasMore}}\"><div class=\"card-foot\"><span class=\"sm\" style=\"font-weight: 700\">Mostrando {{hist.shown}} de {{hist.total}}<\u002Fspan><span class=\"spacer\"><\u002Fspan><button class=\"btn sm\" sc-camel-on-click=\"{{hist.more}}\">{{hist.moreLabel}}<\u002Fbutton><\u002Fdiv><\u002Fsc-if>\n <\u002Fsection>\n <\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n <\u002Fmain>\n<\u002Fdiv>\n\n<!-- ============ DETALLE DEL PEDIDO ============ -->\n<sc-if value=\"{{hasDetail}}\" hint-placeholder-val=\"{{ false }}\">\n<div class=\"drawer-root\">\n <button class=\"overlay\" aria-label=\"Cerrar detalle\" sc-camel-on-click=\"{{closeDetail}}\"><\u002Fbutton>\n <aside class=\"drawer\" aria-label=\"Detalle del pedido\">\n  <div class=\"drawer-h\">\n   <div class=\"row gap12\">\n    <div class=\"grow\"><div class=\"eyebrow\">Pedido web · {{d.dayLabel}} {{d.time}} · {{d.branchName}}<\u002Fdiv><div class=\"drawer-title\">{{d.code}}<\u002Fdiv><\u002Fdiv>\n    <button class=\"icon-btn bordered\" aria-label=\"Cerrar\" sc-camel-on-click=\"{{closeDetail}}\"><svg class=\"ic\" sc-camel-view-box=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M18 6 6 18M6 6l12 12\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n   <\u002Fdiv>\n   <div class=\"row gap8 wrap\"><span class=\"pill {{d.stCls}}\">{{d.stLabel}}<\u002Fspan><sc-if value=\"{{d.late}}\"><span class=\"late\">Sin aceptar +5 min<\u002Fspan><\u002Fsc-if><span class=\"sm\" style=\"font-weight: 700\">{{d.typeLabel}} · {{d.itemsLabel}} · {{d.totalF}} · {{d.waitLabel}}<\u002Fspan><\u002Fdiv>\n   <sc-if value=\"{{d.showSteps}}\"><div class=\"steps\"><sc-for list=\"{{d.steps}}\" as=\"st\" hint-placeholder-count=\"6\"><div class=\"step {{st.cls}}\"><div class=\"sb\"><\u002Fdiv><span class=\"trunc\">{{st.label}}<\u002Fspan><\u002Fdiv><\u002Fsc-for><\u002Fdiv><\u002Fsc-if>\n   <sc-if value=\"{{d.isCancelled}}\"><div class=\"banner b-grey\">Pedido rechazado. Motivo: {{d.reason}}<\u002Fdiv><\u002Fsc-if>\n   <sc-if value=\"{{d.isDelivered}}\"><div class=\"banner b-green\"><svg class=\"ic sm\" sc-camel-view-box=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"><\u002Fpath><\u002Fsvg>Pedido entregado. No hay acciones pendientes.<\u002Fdiv><\u002Fsc-if>\n  <\u002Fdiv>\n  <div class=\"drawer-b\">\n   <section>\n    <div class=\"sect-t\">Cliente<\u002Fdiv>\n    <div class=\"info-card\">\n     <div class=\"avatar\" style=\"background: #6B7280\">{{d.init}}<\u002Fdiv>\n     <div class=\"grow\"><div class=\"strong\">{{d.client}}<\u002Fdiv><div class=\"muted sm num\" style=\"font-weight: 600\">{{d.phone}}<\u002Fdiv><\u002Fdiv>\n     <a class=\"btn sm\" href=\"tel:{{d.phoneRaw}}\"><svg class=\"ic sm\" sc-camel-view-box=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z\"><\u002Fpath><\u002Fsvg>Llamar<\u002Fa>\n    <\u002Fdiv>\n   <\u002Fsection>\n   <section>\n    <div class=\"sect-t\">{{d.addrTitle}}<\u002Fdiv>\n    <div class=\"info-list\">\n     <div class=\"info-row\"><svg class=\"ic sm\" sc-camel-view-box=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z\"><\u002Fpath><circle cx=\"12\" cy=\"10\" r=\"3\"><\u002Fcircle><\u002Fsvg><div class=\"grow\"><div class=\"strong\">{{d.addressLabel}}<\u002Fdiv><div class=\"muted sm\" style=\"font-weight: 600\">Ciudad de Guatemala<\u002Fdiv><\u002Fdiv><span class=\"zone-tag\">{{d.typeShort}}<\u002Fspan><\u002Fdiv>\n     <sc-if value=\"{{d.hasNote}}\"><div class=\"info-row\"><svg class=\"ic sm\" sc-camel-view-box=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z\"><\u002Fpath><path d=\"M14 2v6h6M16 13H8M16 17H8\"><\u002Fpath><\u002Fsvg><div><div class=\"muted xs\" style=\"font-weight: 700\">Observaciones del cliente<\u002Fdiv><div style=\"font-weight: 600\">{{d.note}}<\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fsc-if>\n    <\u002Fdiv>\n   <\u002Fsection>\n   <sc-if value=\"{{d.isDel}}\">\n   <section>\n    <div class=\"sect-t\">Repartidor · PedidosYa Courier<\u002Fdiv>\n    <sc-if value=\"{{d.hasLog}}\">\n     <div class=\"info-card\">\n      <div class=\"avatar\" style=\"background: var(--secondary-soft); color: var(--secondary)\"><svg class=\"ic sm\" sc-camel-view-box=\"0 0 24 24\" aria-hidden=\"true\"><circle cx=\"18.5\" cy=\"17.5\" r=\"3.5\"><\u002Fcircle><circle cx=\"5.5\" cy=\"17.5\" r=\"3.5\"><\u002Fcircle><circle cx=\"15\" cy=\"5\" r=\"1\"><\u002Fcircle><path d=\"M12 17.5V14l-3-3 4-3 2 3h2\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n      <div class=\"grow\"><div class=\"strong\">{{d.rider}}<\u002Fdiv><div class=\"muted xs\" style=\"font-weight: 700; font-family: ui-monospace,Menlo,Consolas,monospace\">{{d.ref}}<\u002Fdiv><\u002Fdiv>\n      <span class=\"pill {{d.logCls}}\">{{d.logLabel}}<\u002Fspan>\n     <\u002Fdiv>\n     <div class=\"times\" style=\"margin-top: 10px\"><div><span class=\"xs muted\" style=\"font-weight: 700\">Solicitado<\u002Fspan><b class=\"num\">{{d.tReq}}<\u002Fb><\u002Fdiv><div><span class=\"xs muted\" style=\"font-weight: 700\">Llegada estimada<\u002Fspan><b class=\"num\">{{d.etaShort}}<\u002Fb><\u002Fdiv><div><span class=\"xs muted\" style=\"font-weight: 700\">Costo PedidosYa<\u002Fspan><b class=\"num\">{{d.costF}}<\u002Fb><\u002Fdiv><\u002Fdiv>\n     <div class=\"track\" style=\"margin-top: 10px\">\n      <sc-for list=\"{{d.track}}\" as=\"t\" hint-placeholder-count=\"6\"><div class=\"trk {{t.cls}}\"><span class=\"tdot\"><\u002Fspan>{{t.label}}<\u002Fdiv><\u002Fsc-for>\n     <\u002Fdiv>\n     <sc-if value=\"{{d.canAdvance}}\"><button class=\"btn sm btn-ghost block mt8\" style=\"border: 1px dashed var(--line-strong)\" sc-camel-on-click=\"{{d.advance}}\">Avanzar estado logístico (simulación)<\u002Fbutton><\u002Fsc-if>\n     <div class=\"xs muted mt8\" style=\"font-weight: 700\">La llegada es un estimado de PedidosYa, no una hora garantizada.<\u002Fdiv>\n    <\u002Fsc-if>\n    <sc-if value=\"{{d.noLog}}\"><div class=\"empty-mini\">Aún sin repartidor. Se solicita cuando el pedido esté listo para despacho.<\u002Fdiv><\u002Fsc-if>\n   <\u002Fsection>\n   <\u002Fsc-if>\n   <section>\n    <div class=\"sect-t\">Productos<\u002Fdiv>\n    <div class=\"items\">\n     <sc-for list=\"{{d.lines}}\" as=\"it\" hint-placeholder-count=\"3\"><div class=\"item\"><span class=\"qty\">{{it.qty}}×<\u002Fspan><span class=\"grow\">{{it.name}}<sc-if value=\"{{it.hasNote}}\"><br><span class=\"note-tag\">Nota: {{it.note}}<\u002Fspan><\u002Fsc-if><\u002Fspan><span class=\"num\">{{it.lineF}}<\u002Fspan><\u002Fdiv><\u002Fsc-for>\n    <\u002Fdiv>\n    <div class=\"totals\">\n     <div class=\"tline\"><span>Subtotal<\u002Fspan><span class=\"num\">{{d.subF}}<\u002Fspan><\u002Fdiv>\n     <sc-if value=\"{{d.isDel}}\"><div class=\"tline\"><span>Envío cotizado al cliente<\u002Fspan><span class=\"num\">{{d.shipF}}<\u002Fspan><\u002Fdiv><\u002Fsc-if>\n     <div class=\"tline total\"><span>TOTAL<\u002Fspan><span class=\"num\">{{d.totalF}}<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n   <\u002Fsection>\n   <section>\n    <div class=\"sect-t\">Historial de estados<\u002Fdiv>\n    <div class=\"hist\"><sc-for list=\"{{d.history}}\" as=\"h\" hint-placeholder-count=\"3\"><div><span class=\"num strong\">{{h.time}}<\u002Fspan><span>{{h.label}}<\u002Fspan><\u002Fdiv><\u002Fsc-for><\u002Fdiv>\n   <\u002Fsection>\n  <\u002Fdiv>\n  <sc-if value=\"{{d.hasActions}}\">\n  <div class=\"drawer-f\">\n   <sc-if value=\"{{d.canAccept}}\"><button class=\"btn btn-primary grow\" sc-camel-on-click=\"{{d.accept}}\"><svg class=\"ic sm\" sc-camel-view-box=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"><\u002Fpath><\u002Fsvg>Aceptar pedido<\u002Fbutton><button class=\"btn btn-ghost danger\" sc-camel-on-click=\"{{openReject}}\">Rechazar<\u002Fbutton><\u002Fsc-if>\n   <sc-if value=\"{{d.canPrep}}\"><button class=\"btn btn-primary grow\" sc-camel-on-click=\"{{d.prep}}\">Marcar en preparación<\u002Fbutton><\u002Fsc-if>\n   <sc-if value=\"{{d.canReady}}\"><button class=\"btn btn-primary grow\" sc-camel-on-click=\"{{d.ready}}\"><svg class=\"ic sm\" sc-camel-view-box=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"><\u002Fpath><\u002Fsvg>Marcar listo<\u002Fbutton><\u002Fsc-if>\n   <sc-if value=\"{{d.canDispatch}}\"><button class=\"btn btn-primary grow lg\" sc-camel-on-click=\"{{d.dispatch}}\"><svg class=\"ic sm\" sc-camel-view-box=\"0 0 24 24\" aria-hidden=\"true\"><circle cx=\"18.5\" cy=\"17.5\" r=\"3.5\"><\u002Fcircle><circle cx=\"5.5\" cy=\"17.5\" r=\"3.5\"><\u002Fcircle><circle cx=\"15\" cy=\"5\" r=\"1\"><\u002Fcircle><path d=\"M12 17.5V14l-3-3 4-3 2 3h2\"><\u002Fpath><\u002Fsvg>SOLICITAR REPARTIDOR<\u002Fbutton><\u002Fsc-if>\n   <sc-if value=\"{{d.dispatchBlocked}}\"><div class=\"banner b-amber grow\">Pedido listo. Un encargado de sucursal solicitará el repartidor.<\u002Fdiv><\u002Fsc-if>\n   <sc-if value=\"{{d.canHandover}}\"><button class=\"btn btn-green grow\" sc-camel-on-click=\"{{d.handover}}\"><svg class=\"ic sm\" sc-camel-view-box=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"><\u002Fpath><\u002Fsvg>Entregado al cliente en tienda<\u002Fbutton><\u002Fsc-if>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n <\u002Faside>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- ============ MODAL: RECHAZAR ============ -->\n<sc-if value=\"{{rejectOpen}}\" hint-placeholder-val=\"{{ false }}\">\n<div class=\"modal-root\">\n <button class=\"overlay\" aria-label=\"Cerrar\" sc-camel-on-click=\"{{closeReject}}\"><\u002Fbutton>\n <div class=\"modal narrow\" role=\"dialog\" aria-modal=\"true\" aria-label=\"Rechazar pedido\">\n  <div class=\"modal-h\"><span class=\"modal-ic mi-coral\"><svg class=\"ic\" sc-camel-view-box=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M18 6 6 18M6 6l12 12\"><\u002Fpath><\u002Fsvg><\u002Fspan><div class=\"grow\"><h3>Rechazar pedido<\u002Fh3><div class=\"sm muted\" style=\"font-weight: 700\">{{d.code}} · {{d.client}}<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n  <div class=\"modal-b\">\n   <div class=\"sm\" style=\"font-weight: 700\">Elige el motivo. Se notificará al cliente.<\u002Fdiv>\n   <div class=\"reasons\"><sc-for list=\"{{rejectReasons}}\" as=\"r\" hint-placeholder-count=\"4\"><button class=\"reason\" sc-camel-on-click=\"{{r.pick}}\">{{r.label}}<\u002Fbutton><\u002Fsc-for><\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"modal-f\"><button class=\"btn\" sc-camel-on-click=\"{{closeReject}}\">Volver<\u002Fbutton><\u002Fdiv>\n <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- ============ MODAL: SOLICITAR REPARTIDOR ============ -->\n<sc-if value=\"{{hasDispatch}}\" hint-placeholder-val=\"{{ false }}\">\n<div class=\"modal-root\">\n <button class=\"overlay\" aria-label=\"Cancelar solicitud\" sc-camel-on-click=\"{{cancelDispatch}}\"><\u002Fbutton>\n <div class=\"modal\" role=\"dialog\" aria-modal=\"true\" aria-label=\"Solicitar repartidor\">\n  <div class=\"modal-h\"><span class=\"modal-ic mi-blue\"><svg class=\"ic\" sc-camel-view-box=\"0 0 24 24\" aria-hidden=\"true\"><circle cx=\"18.5\" cy=\"17.5\" r=\"3.5\"><\u002Fcircle><circle cx=\"5.5\" cy=\"17.5\" r=\"3.5\"><\u002Fcircle><circle cx=\"15\" cy=\"5\" r=\"1\"><\u002Fcircle><path d=\"M12 17.5V14l-3-3 4-3 2 3h2\"><\u002Fpath><\u002Fsvg><\u002Fspan><div class=\"grow\"><h3>Solicitar repartidor<\u002Fh3><div class=\"sm muted\" style=\"font-weight: 700\">PedidosYa Courier · {{dq.code}}<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n  <div class=\"modal-b\">\n   <sc-if value=\"{{dq.loading}}\"><div class=\"banner b-blue\"><span class=\"spinner\"><\u002Fspan>Obteniendo cotización vigente de PedidosYa…<\u002Fdiv><\u002Fsc-if>\n   <sc-if value=\"{{dq.changed}}\">\n    <div class=\"banner b-amber\"><svg class=\"ic sm\" sc-camel-view-box=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z\"><\u002Fpath><path d=\"M12 9v4M12 17h.01\"><\u002Fpath><\u002Fsvg>El costo de envío cambió desde que el cliente hizo su pedido.<\u002Fdiv>\n    <div class=\"cmp\"><div><span class=\"xs muted\" style=\"font-weight: 700\">Cotizado al cliente<\u002Fspan><b class=\"num\">{{dq.quotedF}}<\u002Fb><\u002Fdiv><div><span class=\"xs muted\" style=\"font-weight: 700\">Costo actual<\u002Fspan><b class=\"num\">{{dq.currentF}}<\u002Fb><\u002Fdiv><div><span class=\"xs\" style=\"font-weight: 700\">Diferencia<\u002Fspan><b class=\"num\">{{dq.diffF}}<\u002Fb><\u002Fdiv><\u002Fdiv>\n    <div class=\"sm\" style=\"font-weight: 600\">Confirma si deseas solicitar el repartidor con el costo actual. Al cliente se le mantiene el envío que ya pagó; la diferencia queda registrada en Entregas.<\u002Fdiv>\n   <\u002Fsc-if>\n   <sc-if value=\"{{dq.same}}\"><div class=\"banner b-green\"><svg class=\"ic sm\" sc-camel-view-box=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"><\u002Fpath><\u002Fsvg>Costo vigente {{dq.currentF}} · sin cambios respecto a lo cotizado al cliente.<\u002Fdiv><\u002Fsc-if>\n   <div class=\"info-list\">\n    <div class=\"info-row\"><svg class=\"ic sm\" sc-camel-view-box=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"m2 7 4.41-4.41A2 2 0 0 1 7.83 2h8.34a2 2 0 0 1 1.42.59L22 7\"><\u002Fpath><path d=\"M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8\"><\u002Fpath><\u002Fsvg><div><div class=\"muted xs\" style=\"font-weight: 700\">Recoger en<\u002Fdiv><div class=\"strong\">{{dq.pickup}}<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n    <div class=\"info-row\"><svg class=\"ic sm\" sc-camel-view-box=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z\"><\u002Fpath><circle cx=\"12\" cy=\"10\" r=\"3\"><\u002Fcircle><\u002Fsvg><div><div class=\"muted xs\" style=\"font-weight: 700\">Entregar a<\u002Fdiv><div class=\"strong\">{{dq.client}}<\u002Fdiv><div class=\"sm\" style=\"font-weight: 600\">{{dq.address}}<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n    <div class=\"info-row\"><svg class=\"ic sm\" sc-camel-view-box=\"0 0 24 24\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"><\u002Fcircle><path d=\"M12 6v6l4 2\"><\u002Fpath><\u002Fsvg><div><div class=\"muted xs\" style=\"font-weight: 700\">Llegada<\u002Fdiv><div style=\"font-weight: 600\">Estimada por PedidosYa al asignar repartidor<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n   <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"modal-f\"><button class=\"btn\" sc-camel-on-click=\"{{cancelDispatch}}\">Cancelar<\u002Fbutton><button class=\"btn btn-primary\" disabled=\"{{dq.loading}}\" sc-camel-on-click=\"{{confirmDispatch}}\">Confirmar y solicitar<\u002Fbutton><\u002Fdiv>\n <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- ============ MODAL: PRODUCTO ============ -->\n<sc-if value=\"{{hasPForm}}\" hint-placeholder-val=\"{{ false }}\">\n<div class=\"modal-root\">\n <button class=\"overlay\" aria-label=\"Cerrar\" sc-camel-on-click=\"{{closePForm}}\"><\u002Fbutton>\n <div class=\"modal wide\" role=\"dialog\" aria-modal=\"true\" aria-label=\"Producto\">\n  <div class=\"modal-h\"><span class=\"modal-ic mi-coral\"><svg class=\"ic\" sc-camel-view-box=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"m16 2-2.3 2.3a3 3 0 0 0 0 4.2l1.8 1.8a3 3 0 0 0 4.2 0L22 8\"><\u002Fpath><path d=\"M15 15 3.3 3.3a4.2 4.2 0 0 0 0 6l7.3 7.3c.7.7 2 .7 2.8 0L15 15Zm0 0 7 7M2.1 21.8l6.4-6.3M19 5l-7 7\"><\u002Fpath><\u002Fsvg><\u002Fspan><h3 class=\"grow\">{{pf.title}}<\u002Fh3><\u002Fdiv>\n  <div class=\"modal-b\">\n   <div class=\"photo-drop\">\n    <div class=\"photo-prev {{pf.tileCls}}\"><svg class=\"art\" sc-camel-view-box=\"0 0 200 200\" aria-hidden=\"true\"><g stroke=\"#141414\" stroke-width=\"6\" stroke-linejoin=\"round\"><circle cx=\"134\" cy=\"96\" r=\"44\" fill=\"#141414\"><\u002Fcircle><circle cx=\"134\" cy=\"96\" r=\"31\" fill=\"#FAF8F0\"><\u002Fcircle><circle cx=\"134\" cy=\"96\" r=\"13\" fill=\"#F05249\"><\u002Fcircle><circle cx=\"70\" cy=\"132\" r=\"48\" fill=\"#141414\"><\u002Fcircle><circle cx=\"70\" cy=\"132\" r=\"34\" fill=\"#FAF8F0\"><\u002Fcircle><path d=\"M58 120 h22 v22 h-22 z\" fill=\"#F05249\"><\u002Fpath><\u002Fg><\u002Fsvg><\u002Fdiv>\n    <div class=\"grow\" style=\"display: flex; flex-direction: column; gap: 6px; align-items: flex-start\"><div class=\"strong\">Foto del producto<\u002Fdiv><div class=\"sm muted\" style=\"font-weight: 600\">JPG o PNG cuadrada, mínimo 800 × 800 px.<\u002Fdiv><button class=\"btn sm\" sc-camel-on-click=\"{{uploadPhoto}}\">Subir foto<\u002Fbutton><\u002Fdiv>\n   <\u002Fdiv>\n   <div class=\"form-grid\">\n    <label class=\"field span-2\"><span class=\"flabel\">Nombre<\u002Fspan><input class=\"inp\" value=\"{{pf.name}}\" sc-camel-on-change=\"{{pf.onName}}\"><\u002Flabel>\n    <label class=\"field span-2\"><span class=\"flabel\">Descripción<\u002Fspan><textarea class=\"inp\" value=\"{{pf.desc}}\" sc-camel-on-change=\"{{pf.onDesc}}\"><\u002Ftextarea><\u002Flabel>\n    <div class=\"field span-2\"><span class=\"flabel\">Categoría<\u002Fspan><div class=\"chips\"><sc-for list=\"{{pf.cats}}\" as=\"c\" hint-placeholder-count=\"6\"><button class=\"chip {{c.cls}}\" sc-camel-on-click=\"{{c.pick}}\">{{c.label}}<\u002Fbutton><\u002Fsc-for><\u002Fdiv><\u002Fdiv>\n    <label class=\"field\"><span class=\"flabel\">Precio<\u002Fspan><span class=\"inp-prefix\"><span>Q<\u002Fspan><input class=\"inp\" type=\"number\" min=\"0\" step=\"0.50\" value=\"{{pf.price}}\" sc-camel-on-change=\"{{pf.onPrice}}\"><\u002Fspan><\u002Flabel>\n   <\u002Fdiv>\n   <div class=\"field\"><span class=\"flabel\">Disponibilidad por sucursal<\u002Fspan>\n    <div class=\"info-list\"><sc-for list=\"{{pf.avail}}\" as=\"a\" hint-placeholder-count=\"3\"><div class=\"brsw\"><div class=\"grow\"><div class=\"strong\">{{a.name}}<\u002Fdiv><div class=\"xs muted\" style=\"font-weight: 700\">{{a.zone}}<\u002Fdiv><\u002Fdiv><span class=\"sw-row\"><button class=\"switch {{a.swCls}}\" role=\"switch\" aria-checked=\"{{a.on}}\" aria-label=\"{{a.name}}\" sc-camel-on-click=\"{{a.toggle}}\"><\u002Fbutton>{{a.label}}<\u002Fspan><\u002Fdiv><\u002Fsc-for><\u002Fdiv>\n   <\u002Fdiv>\n   <sc-if value=\"{{pf.hasError}}\"><div class=\"banner b-pink\" role=\"alert\">{{pf.error}}<\u002Fdiv><\u002Fsc-if>\n  <\u002Fdiv>\n  <div class=\"modal-f\"><button class=\"btn\" sc-camel
